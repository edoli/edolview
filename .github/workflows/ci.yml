name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2
  PKG_CONFIG_ALL_STATIC: 1

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            suffix: windows
          - os: macos-15
            label: macOS Apple Silicon
            suffix: mac
          - os: ubuntu-24.04
            label: Linux x64
            suffix: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate Cargo version and release tag
        shell: python
        run: |
          import os, re, tomllib
          version = tomllib.load(open('Cargo.toml', 'rb'))['package']['version']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version) or any(int(p) > 65535 for p in version.split('.')):
              raise SystemExit(f'Invalid Cargo version: {version}')
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and os.environ['GITHUB_REF_NAME'] != f'v{version}':
              raise SystemExit(f"Tag {os.environ['GITHUB_REF_NAME']} must equal v{version}")
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ github.repository }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml', '.github/workflows/ci.yml') }}
          restore-keys: ${{ runner.os }}-${{ github.repository }}-cargo-
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: target/vcpkg
          key: vcpkg-static-crt-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            vcpkg-static-crt-${{ runner.os }}-${{ github.repository }}-
            vcpkg-${{ runner.os }}-${{ github.repository }}
      - name: Install native build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential clang cmake meson ninja-build git curl unzip pkg-config nasm desktop-file-utils zsync dpkg-dev patchelf squashfs-tools file
      - name: Install native build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake meson ninja nasm
      - name: Install native build dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y --no-progress llvm cmake meson ninja pkgconfiglite nasm
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv
          "PATH=C:\Program Files\LLVM\bin;$env:PATH" >> $env:GITHUB_ENV
          'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> $env:GITHUB_ENV
          'CC=clang-cl' >> $env:GITHUB_ENV
          'CXX=clang-cl' >> $env:GITHUB_ENV
      - name: Build native image codecs
        env:
          SYSTEM_DEPS_DAV1D_BUILD_INTERNAL: always
          SYSTEM_DEPS_DAV1D_LINK: static
        run: |
          cargo install cargo-vcpkg --locked
          cargo vcpkg -v build
      - name: Save native codecs independently of app packaging
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target/vcpkg
          key: vcpkg-static-crt-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('Cargo.toml') }}
      - name: Configure native codec build
        shell: bash
        run: |
          echo 'SYSTEM_DEPS_DAV1D_LINK=static' >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Windows ]; then
            echo "PKG_CONFIG_PATH=$(cygpath -m "$GITHUB_WORKSPACE")/target/vcpkg/installed/x64-windows-static/lib/pkgconfig" >> "$GITHUB_ENV"
          elif [ "$RUNNER_OS" = Linux ]; then
            echo 'SYSTEM_DEPS_DAV1D_BUILD_INTERNAL=always' >> "$GITHUB_ENV"
            echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/target/vcpkg/installed/x64-linux-release/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          elif [ "$RUNNER_OS" = macOS ]; then
            echo 'SYSTEM_DEPS_DAV1D_BUILD_INTERNAL=always' >> "$GITHUB_ENV"
            echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/target/vcpkg/installed/arm64-osx-release/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          fi
      - name: Generate icons and desktop integration
        run: cargo run --locked -p xtask --features heif -- icons
      - name: Install DEB packaging tool
        if: runner.os == 'Linux'
        run: cargo install cargo-deb --locked
      - name: Build optimized binary
        run: cargo build --profile release-dist --locked --features heif,avif
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/install_inno.ps1
      - name: Package Windows installer and ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/package.ps1 -NoBuild
      - name: Package macOS or Linux
        if: runner.os != 'Windows'
        run: python tools/package-unix.py --no-build
      - name: Validate final packages
        run: python tools/check-packages.py
      - uses: actions/upload-artifact@v4
        with:
          name: edolview-${{ matrix.suffix }}
          path: |
            target/dist/edolview*
            target/dist/SHA256SUMS-${{ matrix.suffix }}.txt
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: edolview-*
          merge-multiple: true
          path: dist
      - name: Verify complete release assets and checksums
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release-assets.py
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: ${{ steps.assets.outputs.make_latest }}
